workflows:
  sistematich-ios-test:
    name: SisteMatich iOS - Ilk Derleme
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 27.2

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $CM_BUILD_DIR/DerivedData/SourcePackages

    scripts:
      - name: Xcode surumunu kontrol et
        script: |
          set -e
          xcodebuild -version
          swift --version

      - name: SwiftPM onbellegini hazirla
        script: |
          set -e

          echo "SisteMatich SwiftPM cache kontrolu"

          mkdir -p "$CM_BUILD_DIR/DerivedData/SourcePackages"
          mkdir -p "$CM_BUILD_DIR/build_logs"

          echo "Cache dizinleri hazir"

      - name: Xcode paket bagimliliklarini coz
        script: |
          set -e

          SUCCESS=0

          for ATTEMPT in 1 2 3; do
            echo "Paket cozme denemesi: $ATTEMPT"

            if xcodebuild -resolvePackageDependencies \
              -project HomeAssistant.xcodeproj \
              -scheme App-Debug \
              -clonedSourcePackagesDirPath "$CM_BUILD_DIR/DerivedData/SourcePackages"; then
              SUCCESS=1
              break
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Tekrar deneniyor..."
              sleep 20
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "HATA: Paket bagimliliklari cozulemedi"
            exit 1
          fi

          echo "Paket bagimliliklari hazir"

      - name: Proje ve semalari kontrol et
        script: |
          set -e

          xcodebuild -list \
            -project HomeAssistant.xcodeproj

      - name: SisteMatich iOS simulator derlemesi
        script: |
          set -e
          set -o pipefail

          mkdir -p "$CM_BUILD_DIR/build_logs"

          echo "SisteMatich iOS Simulator Build"

          xcodebuild build \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/DerivedData/SourcePackages" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build_logs/ios-build.log"

      - name: SisteMatich App Preview paketini kontrol et
        script: |
          set -e

          APP_DIR="$CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator"

          echo "Simulator paketleri kontrol ediliyor"

          find "$APP_DIR" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print

          APP_COUNT=$(find "$APP_DIR" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | wc -l | tr -d ' ')

          if [ "$APP_COUNT" -eq 0 ]; then
            echo "HATA: iOS Simulator uygulamasi bulunamadi"
            exit 1
          fi

          echo "SisteMatich iOS Simulator paketi hazir"

    artifacts:
      - $CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - $CM_BUILD_DIR/DerivedData/Logs/Build/*.xcactivitylog
      - $CM_BUILD_DIR/build_logs/*.log
