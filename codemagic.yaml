
workflows:
  sistematich-ios-test:
    name: SisteMatich iOS - Ilk Derleme
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 27.2

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages

    scripts:
      - name: Xcode surumunu kontrol et
        script: |
          set -e

          echo "SisteMatich iOS - Xcode kontrolu"
          xcodebuild -version
          swift --version

      - name: SwiftPM onbellegini hazirla
        script: |
          set -e

          mkdir -p "$HOME/Library/Caches/org.swift.swiftpm"
          mkdir -p "$CM_BUILD_DIR/build_logs"

          echo "SwiftPM onbellegi hazir"

      - name: Xcode paket bagimliliklarini coz
        script: |
          set -e

          SUCCESS=0

          for ATTEMPT in 1 2 3; do
            echo "Paket cozme denemesi: $ATTEMPT"

            if xcodebuild -resolvePackageDependencies \
              -project HomeAssistant.xcodeproj \
              -scheme App-Debug; then
              SUCCESS=1
              break
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 20
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "HATA: Paket bagimliliklari cozulemedi"
            exit 1
          fi

          echo "Paketler hazir"

      - name: Proje ve semalari kontrol et
        script: |
          set -e

          xcodebuild -list \
            -project HomeAssistant.xcodeproj

      - name: SisteMatich iOS simulator derlemesi
        script: |
          set -e
          set -o pipefail

          mkdir -p "$CM_BUILD_DIR/build_logs"

          echo "SisteMatich iOS Simulator Build"

          xcodebuild build \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build_logs/ios-build.log"

      - name: SisteMatich uygulama dosyasini kontrol et
        script: |
          set -e

          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

          APP_PATH=$(find "$DERIVED_DATA" \
            -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
            -type d -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: iOS uygulamasi bulunamadi"
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print CFBundleExecutable" \
            "$APP_PATH/Info.plist")

          echo "APP PATH: $APP_PATH"
          echo "EXECUTABLE: $EXECUTABLE"

          test -f "$APP_PATH/$EXECUTABLE"
          test -x "$APP_PATH/$EXECUTABLE"

          file "$APP_PATH/$EXECUTABLE"
          lipo -info "$APP_PATH/$EXECUTABLE"

          echo "Uygulama executable kontrolu basarili"

      - name: SisteMatich Apple Watch Companion ID duzelt
        script: |
          set -e

          echo "===================================="
          echo "SisteMatich Watch Companion Fix"
          echo "===================================="

          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

          APP_PATH=$(find "$DERIVED_DATA" \
            -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
            -type d -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: Ana iOS uygulamasi yok"
            exit 1
          fi

          IPHONE_PLIST="$APP_PATH/Info.plist"

          WATCH_PLIST="$APP_PATH/Watch/HomeAssistant-WatchApp.app/Info.plist"

          if [ ! -f "$WATCH_PLIST" ]; then
            echo "HATA: Watch Info.plist bulunamadi"
            exit 1
          fi

          IPHONE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$IPHONE_PLIST")

          WATCH_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$WATCH_PLIST")

          echo "iPhone Bundle ID: $IPHONE_ID"
          echo "Watch Bundle ID: $WATCH_ID"

          echo "Watch Companion mevcut deger:"

          /usr/libexec/PlistBuddy \
            -c "Print :WKCompanionAppBundleIdentifier" \
            "$WATCH_PLIST" || true

          if /usr/libexec/PlistBuddy \
            -c "Print :WKCompanionAppBundleIdentifier" \
            "$WATCH_PLIST" >/dev/null 2>&1; then

            /usr/libexec/PlistBuddy \
              -c "Set :WKCompanionAppBundleIdentifier $IPHONE_ID" \
              "$WATCH_PLIST"

          else

            /usr/libexec/PlistBuddy \
              -c "Add :WKCompanionAppBundleIdentifier string $IPHONE_ID" \
              "$WATCH_PLIST"

          fi

          COMPANION=$(/usr/libexec/PlistBuddy \
            -c "Print :WKCompanionAppBundleIdentifier" \
            "$WATCH_PLIST")

          echo "Yeni Watch Companion ID: $COMPANION"

          if [ "$COMPANION" != "$IPHONE_ID" ]; then
            echo "HATA: Companion ID eslesmedi"
            exit 1
          fi

          echo "Watch Companion ID duzeltildi"

      - name: SisteMatich UTF8 ZIP paketini olustur
        script: |
          set -e
          set -o pipefail

          echo "===================================="
          echo "SisteMatich UTF8 ZIP Packaging"
          echo "===================================="

          mkdir -p "$CM_BUILD_DIR/build_logs"

          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

          APP_PATH=$(find "$DERIVED_DATA" \
            -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
            -type d -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app paketi bulunamadi"
            exit 1
          fi

          export APP_PATH

          export ZIP_FILE="$CM_BUILD_DIR/SisteMatich_iOS_Simulator_17_UTF8.zip"

          python3 <<'PY'
          import os
          import stat
          import zipfile
          import plistlib
          import pathlib

          app = pathlib.Path(os.environ["APP_PATH"])
          output = pathlib.Path(os.environ["ZIP_FILE"])

          with open(app / "Info.plist", "rb") as f:
              info = plistlib.load(f)

          executable = info["CFBundleExecutable"]
          executable_path = app / executable

          if not executable_path.is_file():
              raise RuntimeError(
                  "Executable bulunamadi: " + executable
              )

          if not os.access(executable_path, os.X_OK):
              raise RuntimeError(
                  "Executable calistirma izni yok"
              )

          print("App:", app.name)
          print("Executable:", executable)
          print("Bundle ID:", info["CFBundleIdentifier"])

          if output.exists():
              output.unlink()

          def add_entry(archive, path):
              metadata = os.lstat(path)
              relative = path.relative_to(app.parent).as_posix()

              is_dir = stat.S_ISDIR(metadata.st_mode)

              if is_dir:
                  relative += "/"

              zi = zipfile.ZipInfo(relative)

              zi.create_system = 3
              zi.external_attr = metadata.st_mode << 16

              if is_dir:
                  zi.compress_type = zipfile.ZIP_STORED
                  archive.writestr(zi, b"")

                  for child in sorted(path.iterdir()):
                      add_entry(archive, child)

              elif stat.S_ISLNK(metadata.st_mode):
                  zi.compress_type = zipfile.ZIP_STORED
                  zi.external_attr = (
                      stat.S_IFLNK | 0o777
                  ) << 16

                  target = os.readlink(path)
                  archive.writestr(
                      zi,
                      os.fsencode(target)
                  )

              elif stat.S_ISREG(metadata.st_mode):
                  zi.compress_type = zipfile.ZIP_DEFLATED

                  with open(path, "rb") as source:
                      with archive.open(zi, "w") as dest:
                          while True:
                              chunk = source.read(1024 * 1024)

                              if not chunk:
                                  break

                              dest.write(chunk)

          with zipfile.ZipFile(
              output,
              "w",
              allowZip64=True
          ) as archive:
              add_entry(archive, app)

          print("ZIP olusturuldu:", output)
          print("ZIP boyutu:", output.stat().st_size)

          with zipfile.ZipFile(output) as archive:
              bad = archive.testzip()

              if bad is not None:
                  raise RuntimeError(
                      "ZIP bozuk: " + bad
                  )

              prefix = app.name + "/"

              binary_name = prefix + executable

              names = archive.namelist()

              if binary_name not in names:
                  raise RuntimeError(
                      "ZIP executable bulunamadi"
                  )

              executable_info = archive.getinfo(
                  binary_name
              )

              permission = (
                  executable_info.external_attr >> 16
              )

              if not permission & 0o111:
                  raise RuntimeError(
                      "ZIP executable izni yok"
                  )

              if not executable_info.flag_bits & 0x800:
                  raise RuntimeError(
                      "ZIP UTF8 isareti bulunamadi"
                  )

              watch_plist_name = (
                  prefix
                  + "Watch/HomeAssistant-WatchApp.app/"
                  + "Info.plist"
              )

              watch_info = plistlib.loads(
                  archive.read(watch_plist_name)
              )

              companion = watch_info[
                  "WKCompanionAppBundleIdentifier"
              ]

              if companion != info["CFBundleIdentifier"]:
                  raise RuntimeError(
                      "Watch Companion ID hatali"
                  )

              print("ZIP executable:", binary_name)
              print("Executable izin:", oct(permission))
              print("UTF8 flag:", executable_info.flag_bits)
              print("Watch Companion:", companion)
              print("Toplam ZIP girdisi:", len(names))

              print("ZIP DOGRULAMASI BASARILI")
          PY

          echo "SisteMatich ZIP dosyasi:"
          ls -lh "$ZIP_FILE"

      - name: SisteMatich derleme sonucunu kontrol et
        script: |
          set -e

          echo "===================================="
          echo "SisteMatich iOS Build Complete"
          echo "===================================="

          ZIP_FILE="$CM_BUILD_DIR/SisteMatich_iOS_Simulator_17_UTF8.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "HATA: ZIP bulunamadi veya bos"
            exit 1
          fi

          echo "ZIP mevcut:"
          ls -lh "$ZIP_FILE"

          echo "SisteMatich iOS paket hazir"

    artifacts:
      - '$CM_BUILD_DIR/SisteMatich_iOS_Simulator_17_UTF8.zip'
      - '$HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app'
      - '$HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog'
      - '$CM_BUILD_DIR/build_logs/*.log'
