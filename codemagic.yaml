workflows:
  sistematich-ios-test:
    name: SisteMatich iOS - Ilk Derleme
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 27.2

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages

    scripts:
      - name: Xcode surumunu kontrol et
        script: |
          set -e

          echo "SisteMatich iOS - Xcode kontrolu"

          xcodebuild -version
          swift --version

      - name: SwiftPM onbellegini hazirla
        script: |
          set -e

          echo "SisteMatich SwiftPM onbellegi"

          mkdir -p "$HOME/Library/Caches/org.swift.swiftpm"
          mkdir -p "$CM_BUILD_DIR/build_logs"

          echo "Onbellek hazir"

      - name: Xcode paket bagimliliklarini coz
        script: |
          set -e

          echo "SisteMatich paket bagimliliklari"

          SUCCESS=0

          for ATTEMPT in 1 2 3; do

            echo "Paket cozme denemesi: $ATTEMPT"

            if xcodebuild -resolvePackageDependencies \
              -project HomeAssistant.xcodeproj \
              -scheme App-Debug; then

              SUCCESS=1
              break
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              echo "Paket bagimliliklari yeniden deneniyor"
              sleep 20
            fi

          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "HATA: Paket bagimliliklari cozulemedi"
            exit 1
          fi

          echo "Paket bagimliliklari hazir"

      - name: Proje ve semalari kontrol et
        script: |
          set -e

          xcodebuild -list \
            -project HomeAssistant.xcodeproj

      - name: SisteMatich iOS simulator derlemesi
        script: |
          set -e
          set -o pipefail

          mkdir -p "$CM_BUILD_DIR/build_logs"

          echo "SisteMatich iOS Simulator Build"
          echo "Xcode varsayilan DerivedData kullaniliyor"

          xcodebuild build \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build_logs/ios-build.log"

      - name: SisteMatich App Preview paketini kontrol et
        script: |
          set -e

          echo "SisteMatich iOS App Preview kontrolu"

          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

          APP_COUNT=$(find "$DERIVED_DATA" \
            -path "*/Build/Products/Debug-iphonesimulator/*.app" \
            -type d \
            -print | wc -l | tr -d ' ')

          find "$DERIVED_DATA" \
            -path "*/Build/Products/Debug-iphonesimulator/*.app" \
            -type d \
            -print

          if [ "$APP_COUNT" -eq 0 ]; then
            echo "HATA: Simulator .app bulunamadi"
            exit 1
          fi

          echo "SisteMatich iOS .app paketi hazir"

      - name: SisteMatich derleme sonucunu kontrol et
        script: |
          set -e

          echo "SisteMatich iOS build tamamlandi"

          echo "Varsayilan DerivedData yolu:"
          echo "$HOME/Library/Developer/Xcode/DerivedData"

          echo "App Preview icin .app dosyalari:"
          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Debug-iphonesimulator/*.app" \
            -type d \
            -print

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
      - $CM_BUILD_DIR/build_logs/*.log
