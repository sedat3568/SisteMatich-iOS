
      - name: SisteMatich App Group yetki analizi
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/build_logs"

          LOG_FILE="$CM_BUILD_DIR/build_logs/app-group-analysis.log"

          {
            echo "========================================"
            echo "SisteMatich App Group Diagnostics"
            echo "========================================"

            DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

            APP_PATH=$(find "$DERIVED_DATA" \
              -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
              -type d -print -quit)

            if [ -z "$APP_PATH" ]; then
              echo "HATA: iOS uygulamasi bulunamadi"
              exit 1
            fi

            echo "APP PATH: $APP_PATH"

            echo ""
            echo "1. Bundle Identifier"

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"

            echo ""
            echo "2. Code Signing Status"

            codesign -dv "$APP_PATH" 2>&1 || true

            echo ""
            echo "3. Signed Entitlements"

            codesign -d --entitlements :- \
              "$APP_PATH" 2>&1 || true

            echo ""
            echo "4. Generated Xcent Files"

            find "$DERIVED_DATA" \
              -name "*.xcent" \
              -type f \
              -print

            echo ""
            echo "5. App Group Build Settings"

            xcodebuild -showBuildSettings \
              -project HomeAssistant.xcodeproj \
              -scheme App-Debug \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              2>/dev/null | grep -E \
              "CODE_SIGN_ENTITLEMENTS|CODE_SIGNING_ALLOWED|PRODUCT_BUNDLE_IDENTIFIER|BUNDLE_ID_PREFIX|BUNDLE_ID_SUFFIX" \
              || true

            echo ""
            echo "6. Entitlements Source"

            if [ -f "Configuration/Entitlements/App-ios.entitlements" ]; then
              plutil -p \
                Configuration/Entitlements/App-ios.entitlements
            fi

            echo ""
            echo "========================================"
            echo "SisteMatich App Group Analysis Complete"
            echo "========================================"

          } 2>&1 | tee "$LOG_FILE"
