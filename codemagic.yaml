
workflows:
  sistematich-ios-test:
    name: SisteMatich iOS - Ilk Derleme
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 27.2

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData/SourcePackages

    scripts:
      - name: Xcode surumunu kontrol et
        script: |
          set -e
          echo "SisteMatich iOS - Xcode kontrolu"
          xcodebuild -version
          swift --version

      - name: SwiftPM onbellegini hazirla
        script: |
          set -e
          mkdir -p "$HOME/Library/Caches/org.swift.swiftpm"
          mkdir -p "$CM_BUILD_DIR/build_logs"
          echo "SwiftPM onbellegi hazir"

      - name: Xcode paket bagimliliklarini coz
        script: |
          set -e
          SUCCESS=0

          for ATTEMPT in 1 2 3; do
            echo "Paket cozme denemesi: $ATTEMPT"

            if xcodebuild -resolvePackageDependencies \
              -project HomeAssistant.xcodeproj \
              -scheme App-Debug; then
              SUCCESS=1
              break
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 20
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "HATA: Paket bagimliliklari cozulemedi"
            exit 1
          fi

      - name: Proje ve semalari kontrol et
        script: |
          set -e
          xcodebuild -list \
            -project HomeAssistant.xcodeproj

      - name: SisteMatich iOS simulator derlemesi
        script: |
          set -e
          set -o pipefail

          mkdir -p "$CM_BUILD_DIR/build_logs"

          xcodebuild build \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build_logs/ios-build.log"

      - name: SisteMatich calistirilabilir dosya analizi
        script: |
          set -e
          set -o pipefail

          LOG_FILE="$CM_BUILD_DIR/build_logs/executable-analysis.log"

          {
            DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

            APP_PATH=$(find "$DERIVED_DATA" \
              -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
              -type d -print -quit)

            if [ -z "$APP_PATH" ]; then
              echo "HATA: Ana uygulama bulunamadi"
              exit 1
            fi

            echo "APP PATH: $APP_PATH"

            EXECUTABLE=$(/usr/libexec/PlistBuddy \
              -c "Print CFBundleExecutable" \
              "$APP_PATH/Info.plist")

            echo "EXECUTABLE NAME: $EXECUTABLE"

            EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE"

            test -f "$EXECUTABLE_PATH"
            test -x "$EXECUTABLE_PATH"

            echo "Executable mevcut ve calistirilabilir"

            file "$EXECUTABLE_PATH"
            lipo -info "$EXECUTABLE_PATH"

            echo "DEBUG DYLIB:"
            find "$APP_PATH" \
              -maxdepth 1 \
              -name "*.debug.dylib" \
              -type f \
              -exec file {} \;

            echo "BUNDLE ID:"
            /usr/libexec/PlistBuddy \
              -c "Print CFBundleIdentifier" \
              "$APP_PATH/Info.plist"

            echo "PLATFORM:"
            /usr/libexec/PlistBuddy \
              -c "Print CFBundleSupportedPlatforms" \
              "$APP_PATH/Info.plist"

          } 2>&1 | tee "$LOG_FILE"

      - name: SisteMatich App Preview paketini kontrol et
        script: |
          set -e

          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

          APP_PATH=$(find "$DERIVED_DATA" \
            -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
            -type d -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: Simulator uygulamasi bulunamadi"
            exit 1
          fi

          echo "SisteMatich iOS .app paketi hazir"
          echo "$APP_PATH"

      - name: SisteMatich VibeView ZIP paketini olustur
        script: |
          set -e
          set -o pipefail

          echo "===================================="
          echo "SisteMatich iOS ZIP Packaging"
          echo "===================================="

          DERIVED_DATA="$HOME/Library/Developer/Xcode/DerivedData"

          APP_PATH=$(find "$DERIVED_DATA" \
            -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
            -type d -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app paketi bulunamadi"
            exit 1
          fi

          ZIP_FILE="$CM_BUILD_DIR/SisteMatich_iOS_Simulator_16.zip"

          rm -f "$ZIP_FILE"

          echo "macOS ditto ile ZIP olusturuluyor"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$ZIP_FILE"

          echo "ZIP butunluk testi:"
          unzip -tqq "$ZIP_FILE"

          echo "ZIP boyutu:"
          ls -lh "$ZIP_FILE"

          echo "ZIP icerigini dogrulama:"

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          import plistlib

          archive_path = sys.argv[1]

          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]

              plist_entries = [
                  name for name in names
                  if name.endswith(".app/Info.plist")
                  and name.count(".app/") == 1
              ]

              if len(plist_entries) != 1:
                  raise RuntimeError(
                      "Ana uygulama Info.plist bulunamadi"
                  )

              plist_name = plist_entries[0]
              app_prefix = plist_name[:-len("Info.plist")]

              plist = plistlib.loads(archive.read(plist_name))
              executable = plist["CFBundleExecutable"]

              binary_name = app_prefix + executable

              if binary_name not in names:
                  raise RuntimeError(
                      "ZIP icinde executable bulunamadi: "
                      + binary_name
                  )

              binary = archive.getinfo(binary_name)
              mode = binary.external_attr >> 16

              if not (mode & 0o111):
                  raise RuntimeError(
                      "ZIP icinde executable izni bulunamadi"
                  )

              print("Ana uygulama:", app_prefix)
              print("Executable:", executable)
              print("Calistirma izni:", oct(mode))
              print("Toplam dosya:", len(infos))
              print("ZIP dogrulamasi basarili")
          PY

          echo "===================================="
          echo "SisteMatich VibeView ZIP hazir"
          echo "===================================="

      - name: SisteMatich derleme sonucunu kontrol et
        script: |
          set -e

          echo "SisteMatich iOS build tamamlandi"

          echo "Simulatore ait uygulama:"
          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app" \
            -type d -print

          echo "Yeni ZIP:"
          ls -lh "$CM_BUILD_DIR/SisteMatich_iOS_Simulator_16.zip"

    artifacts:
      - '$CM_BUILD_DIR/SisteMatich_iOS_Simulator_16.zip'
      - '$HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/Home Assistant Δ.app'
      - '$HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog'
      - '$CM_BUILD_DIR/build_logs/*.log'
